<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수강생 로그인 - 교원의 현장 연구 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-top: 10px;
        }

        .login-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .error-message {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 0.9em;
            display: none;
        }

        .success-message {
            color: #43e97b;
            margin-top: 10px;
            font-size: 0.9em;
            display: none;
        }

        .link-section {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .link-section a {
            color: #667eea;
            text-decoration: none;
        }

        .link-section a:hover {
            text-decoration: underline;
        }

        .info-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }

        .info-box p {
            color: #1976d2;
            font-size: 0.9em;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>수강생 로그인</h1>
            <p>교원의 현장 연구 2026</p>
        </div>

        <div class="info-box">
            <p><strong>안내:</strong> 강사로부터 받은 클래스 등록 코드를 입력하세요.</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="studentName">이름</label>
                <input type="text" id="studentName" required placeholder="이름을 입력하세요">
            </div>

            <div class="form-group">
                <label for="classCode">클래스 등록 코드</label>
                <input type="text" id="classCode" required placeholder="강사로부터 받은 코드를 입력하세요" style="text-transform: uppercase;">
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <button type="submit" class="login-button">로그인</button>
        </form>

        <div class="link-section">
            <a href="login.html">강사/관리자 로그인</a>
        </div>
    </div>

    <!-- Supabase 스크립트 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Supabase 클라이언트 초기화 (즉시 실행 함수로 중복 방지)
        (function() {
            'use strict';
            
            // 이미 초기화되었으면 건너뛰기
            if (window.supabaseClient) {
                console.log('✅ Supabase 클라이언트가 이미 초기화되어 있습니다.');
                return;
            }
            
            const SUPABASE_URL = 'https://jxeyvvstwoktkoaltmie.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4ZXl2dnN0d29rdGtvYWx0bWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2MDQ5MTAsImV4cCI6MjA4MzE4MDkxMH0.iQOBtE9XH7EhZt2vC1wM_CrgD06oxCgHpus0LO8bc-I';
            
            // Supabase 라이브러리 로드 대기
            function initSupabase() {
                if (typeof window.supabase !== 'undefined' && window.supabase && typeof window.supabase.createClient === 'function') {
                    try {
                        if (!window.supabaseClient) {
                            window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                            console.log('✅ Supabase 클라이언트 초기화 완료');
                        }
                    } catch (error) {
                        console.error('❌ Supabase 클라이언트 생성 실패:', error);
                    }
                } else {
                    // 아직 로드되지 않았으면 100ms 후 다시 시도 (최대 5초)
                    if (typeof initSupabase.retryCount === 'undefined') {
                        initSupabase.retryCount = 0;
                    }
                    if (initSupabase.retryCount < 50) {
                        initSupabase.retryCount++;
                        setTimeout(initSupabase, 100);
                    } else {
                        console.error('❌ Supabase 라이브러리를 로드할 수 없습니다.');
                    }
                }
            }
            
            // 즉시 초기화 시도
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initSupabase);
            } else {
                initSupabase();
            }
        })();
        
        // Supabase 클라이언트 가져오기
        function getSupabaseClient() {
            if (window.supabaseClient) {
                return window.supabaseClient;
            }
            // 클라이언트가 없으면 다시 초기화 시도
            if (typeof window.supabase !== 'undefined' && window.supabase && typeof window.supabase.createClient === 'function') {
                const SUPABASE_URL = 'https://jxeyvvstwoktkoaltmie.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4ZXl2dnN0d29rdGtvYWx0bWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2MDQ5MTAsImV4cCI6MjA4MzE4MDkxMH0.iQOBtE9XH7EhZt2vC1wM_CrgD06oxCgHpus0LO8bc-I';
                try {
                    window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    console.log('✅ Supabase 클라이언트 생성 완료 (지연 초기화)');
                    return window.supabaseClient;
                } catch (error) {
                    console.error('❌ Supabase 클라이언트 생성 실패:', error);
                }
            }
            console.warn('⚠️ Supabase 클라이언트를 사용할 수 없습니다.');
            return null;
        }

        // Supabase에서 등록 코드로 클래스 찾기
        async function findClassByCode(code) {
            const supabaseClient = getSupabaseClient();
            const searchCode = code.toUpperCase().trim();
            
            console.log('🔍 클래스 검색 시작:', searchCode);
            
            // 1단계: Supabase에서 검색
            if (supabaseClient) {
                try {
                    console.log('📡 Supabase에서 클래스 검색 중...');
                    const { data, error } = await supabaseClient
                        .from('classes')
                        .select('*')
                        .eq('code', searchCode)
                        .maybeSingle();
                    
                    console.log('📡 Supabase 검색 결과:', { data, error });
                    
                    if (!error && data) {
                        console.log('✅ Supabase에서 클래스를 찾았습니다:', data);
                        return {
                            class: {
                                id: data.id,
                                name: data.name,
                                description: data.description || '',
                                code: data.code,
                                createdAt: new Date(data.created_at).getTime()
                            },
                            teacherUsername: data.teacher_username
                        };
                    } else if (error) {
                        // 테이블이 없거나 에러가 발생한 경우
                        console.error('❌ Supabase 검색 오류 상세:', {
                            code: error.code,
                            message: error.message,
                            details: error.details,
                            hint: error.hint
                        });
                        if (error.code === 'PGRST116' || error.message?.includes('relation') || error.message?.includes('does not exist')) {
                            console.warn('⚠️ Supabase 테이블이 없습니다. localStorage에서 검색합니다.');
                        } else if (error.code === 'PGRST301' || error.message?.includes('permission denied') || error.message?.includes('RLS')) {
                            console.error('❌ RLS 정책 오류: Supabase 테이블에 접근 권한이 없습니다.');
                            console.error('💡 해결 방법: Supabase 대시보드에서 supabase-classes-setup.sql을 실행하세요.');
                        } else {
                            console.warn('⚠️ Supabase 검색 오류:', error);
                        }
                    } else if (!data) {
                        console.log('ℹ️ Supabase에서 클래스를 찾지 못했습니다 (데이터 없음)');
                    }
                } catch (error) {
                    console.error('❌ 클래스 검색 예외:', error);
                }
            }
            
            // 2단계: localStorage에서 검색 (하위 호환성)
            console.log('💾 localStorage에서 클래스 검색 중...');
            const keys = Object.keys(localStorage);
            for (let key of keys) {
                if (key.startsWith('teacher_classes_')) {
                    try {
                        const classes = JSON.parse(localStorage.getItem(key) || '[]');
                        const found = classes.find(c => c.code === searchCode);
                        if (found) {
                            console.log('✅ localStorage에서 클래스를 찾았습니다:', found);
                            return {
                                class: found,
                                teacherUsername: key.replace('teacher_classes_', '')
                            };
                        }
                    } catch (e) {
                        console.error('localStorage 파싱 오류:', e);
                    }
                }
            }
            
            console.log('❌ 클래스를 찾을 수 없습니다:', searchCode);
            return null;
        }

        // Supabase에서 수강생 등록 여부 확인
        async function isStudentRegistered(classId, studentName) {
            const supabaseClient = getSupabaseClient();
            
            // Supabase를 사용할 수 있는 경우
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('students')
                        .select('*')
                        .eq('class_id', classId)
                        .eq('name', studentName)
                        .maybeSingle(); // single() 대신 maybeSingle() 사용 (없을 수도 있음)
                    
                    if (!error && data) {
                        return true; // 등록됨
                    }
                } catch (error) {
                    console.error('수강생 등록 확인 오류:', error);
                }
            }
            
            // Supabase에서 찾지 못했거나 사용할 수 없는 경우 localStorage에서 찾기
            const keys = Object.keys(localStorage);
            for (let key of keys) {
                if (key.startsWith('teacher_classes_')) {
                    const classes = JSON.parse(localStorage.getItem(key) || '[]');
                    const cls = classes.find(c => c.id === classId);
                    if (cls && cls.students) {
                        return cls.students.some(s => s.name === studentName);
                    }
                }
            }
            return false;
        }

        // Supabase에 수강생 등록
        async function registerStudent(classId, studentName, teacherUsername) {
            // 중복 확인
            const isRegistered = await isStudentRegistered(classId, studentName);
            if (isRegistered) {
                return; // 이미 등록됨
            }
            
            const supabaseClient = getSupabaseClient();
            
            // Supabase를 사용할 수 있는 경우
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('students')
                        .insert([
                            {
                                class_id: classId,
                                name: studentName
                            }
                        ])
                        .select();
                    
                    if (error) {
                        console.error('Supabase 수강생 등록 오류:', error);
                        // 테이블이 없거나 에러가 발생한 경우 localStorage에 저장
                    } else if (data) {
                        console.log('Supabase에 수강생 등록 성공:', data);
                        return; // 성공적으로 등록됨
                    }
                } catch (error) {
                    console.error('수강생 등록 예외:', error);
                }
            }
            
            // Supabase에 저장하지 못한 경우 localStorage에 저장 (하위 호환성)
            console.log('localStorage에 수강생 저장 중...');
            const key = `teacher_classes_${teacherUsername}`;
            const classes = JSON.parse(localStorage.getItem(key) || '[]');
            const cls = classes.find(c => c.id === classId);
            
            if (cls) {
                if (!cls.students) {
                    cls.students = [];
                }
                
                if (!cls.students.some(s => s.name === studentName)) {
                    cls.students.push({
                        name: studentName,
                        registeredAt: Date.now()
                    });
                    localStorage.setItem(key, JSON.stringify(classes));
                    console.log('localStorage에 수강생 저장 완료');
                }
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const studentName = document.getElementById('studentName').value.trim();
            const classCode = document.getElementById('classCode').value.trim().toUpperCase();
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            if (!studentName) {
                errorMsg.textContent = '이름을 입력해주세요.';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (!classCode) {
                errorMsg.textContent = '클래스 등록 코드를 입력해주세요.';
                errorMsg.style.display = 'block';
                return;
            }
            
            // 로딩 표시
            const loginButton = event.target.querySelector('button[type="submit"]') || document.querySelector('.login-button');
            const originalButtonText = loginButton.textContent;
            loginButton.disabled = true;
            loginButton.textContent = '검색 중...';
            
            try {
                // 클래스 찾기
                const result = await findClassByCode(classCode);
                if (!result) {
                    errorMsg.textContent = '올바르지 않은 등록 코드입니다. 등록 코드를 확인해주세요.';
                    errorMsg.style.display = 'block';
                    loginButton.disabled = false;
                    loginButton.textContent = originalButtonText;
                    return;
                }
            
            // 수강생 등록 확인 및 등록
            const isRegistered = await isStudentRegistered(result.class.id, studentName);
            if (!isRegistered) {
                await registerStudent(result.class.id, studentName, result.teacherUsername);
                successMsg.textContent = '수강생으로 등록되었습니다.';
                successMsg.style.display = 'block';
            }
            
                // 세션 저장
                const session = {
                    type: 'student',
                    name: studentName,
                    classId: result.class.id,
                    className: result.class.name,
                    teacherUsername: result.teacherUsername,
                    loginTime: Date.now()
                };
                sessionStorage.setItem('userSession', JSON.stringify(session));
                
                // 성공 메시지
                successMsg.textContent = '로그인 성공! 메인 페이지로 이동합니다...';
                successMsg.style.display = 'block';
                
                // 메인 페이지로 이동
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } catch (error) {
                console.error('로그인 처리 오류:', error);
                errorMsg.textContent = '로그인 중 오류가 발생했습니다. 다시 시도해주세요.';
                errorMsg.style.display = 'block';
                loginButton.disabled = false;
                loginButton.textContent = originalButtonText;
            }
        }
    </script>
</body>
</html>

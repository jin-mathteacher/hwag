<script>
        // 1. 설정값
        const MAX_FILE_SIZE = 20 * 1024 * 1024; // 20MB
        const SUPABASE_BUCKET = 'class-materials';

        // 2. Supabase 클라이언트 가져오기 (1단계에서 만든 것)
        const supabase = window.supabaseClient;

        // 3. 세션 확인 (로그인 체크)
        // 로그인 안 했으면 '익명'으로라도 처리하게 수정 (테스트 위해)
        let session = {};
        try {
            session = JSON.parse(sessionStorage.getItem('userSession') || '{}');
        } catch (e) {
            console.log('세션 정보 없음');
        }

        // 4. 드래그 앤 드롭 기능 활성화
        const dropArea = document.getElementById('dropArea');
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');

        if (dropArea) {
            // 박스 안에 파일이 들어왔을 때 (색깔 변경)
            dropArea.addEventListener('dragover', function(e) {
                e.preventDefault(); // 필수: 브라우저가 파일 여는 것 방지
                e.stopPropagation();
                uploadSection.classList.add('drag-over');
            });

            // 박스 밖으로 나갔을 때 (색깔 복구)
            dropArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                uploadSection.classList.remove('drag-over');
            });

            // 파일을 놓았을 때 (업로드 시작)
            dropArea.addEventListener('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                uploadSection.classList.remove('drag-over');
                
                const files = Array.from(e.dataTransfer.files);
                handleFiles(files); // 업로드 함수 실행
            });
        }

        // 5. 파일 선택 버튼으로 업로드할 때
        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            handleFiles(files);
        }

        // 6. 실제 업로드 처리 함수
        async function handleFiles(files) {
            if (!supabase) {
                alert('Supabase 연결에 실패했습니다. 새로고침 해주세요.');
                return;
            }

            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            progressContainer.style.display = 'block';

            let uploaded = 0;
            let failed = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                // 용량 체크
                if (file.size > MAX_FILE_SIZE) {
                    alert(`파일 "${file.name}"이 20MB를 넘습니다.`);
                    failed++;
                    continue;
                }

                try {
                    // 파일명 생성 (한글 깨짐 방지 위해 encodeURI 사용하거나 영문 변환 추천하지만, 일단 그대로)
                    const fileExt = file.name.split('.').pop();
                    // 이름 결정: 로그인 이름 없으면 '익명'
                    const uploaderName = session.name || session.username || '익명'; 
                    // 파일명 중복 방지를 위해 시간_랜덤숫자_파일명 조합
                    const fileName = `${Date.now()}_${Math.random().toString(36).substr(2, 5)}.${fileExt}`;
                    const filePath = `materials/${fileName}`; // 폴더 경로

                    // A. 스토리지에 파일 올리기
                    const { data, error: uploadError } = await supabase.storage
                        .from(SUPABASE_BUCKET)
                        .upload(filePath, file);

                    if (uploadError) {
                        throw uploadError;
                    }

                    // B. DB(장부)에 기록하기
                    const { error: dbError } = await supabase
                        .from('files')
                        .insert([{ 
                            file_name: file.name, 
                            file_url: filePath, // 경로 저장
                            file_size: file.size, 
                            uploader_id: null, // 익명 허용했으므로 null
                            created_at: new Date().toISOString()
                        }]);
                    
                    if (dbError) {
                        console.error('DB 저장 실패:', dbError);
                        // DB 실패 시 파일도 지워주는 게 정석이지만 테스트니 패스
                    }

                    uploaded++;

                    // 진행바 업데이트
                    const progress = ((i + 1) / files.length) * 100;
                    progressFill.style.width = progress + '%';

                } catch (error) {
                    console.error('업로드 실패:', error);
                    alert(`"${file.name}" 업로드 실패: ${error.message}`);
                    failed++;
                }
            }

            // 마무리
            await loadFiles(); // 목록 새로고침
            
            setTimeout(() => {
                progressContainer.style.display = 'none';
                progressFill.style.width = '0%';
            }, 1000);
            
            fileInput.value = ''; // 입력창 비우기

            if (uploaded > 0) alert(`${uploaded}개 파일 업로드 성공!`);
        }

        // 7. 파일 목록 불러오기
        async function loadFiles() {
            if (!supabase) return;

            const fileList = document.getElementById('fileList');
            
            try {
                const { data, error } = await supabase
                    .from('files')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    fileList.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">아직 업로드된 파일이 없습니다.</p>';
                    return;
                }

                // 목록 그리기
                fileList.innerHTML = data.map(file => {
                    const sizeMB = (file.file_size / (1024 * 1024)).toFixed(2);
                    const date = new Date(file.created_at).toLocaleString();
                    
                    return `
                        <div class="file-item">
                            <div class="file-info">
                                <h3 style="cursor:pointer; color:#667eea;" onclick="downloadFile('${file.file_url}', '${file.file_name}')">
                                    📄 ${file.file_name}
                                </h3>
                                <div class="file-meta">
                                    <span>💾 ${sizeMB} MB</span>
                                    <span>📅 ${date}</span>
                                </div>
                            </div>
                            <button class="delete-button" onclick="deleteFile('${file.id}', '${file.file_url}')">삭제</button>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('목록 로딩 실패:', error);
                fileList.innerHTML = '<p>파일 목록을 불러오지 못했습니다.</p>';
            }
        }

        // 8. 다운로드 함수
        async function downloadFile(filePath, fileName) {
            try {
                const { data, error } = await supabase.storage
                    .from(SUPABASE_BUCKET)
                    .download(filePath);

                if (error) throw error;

                const url = URL.createObjectURL(data);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (error) {
                alert('다운로드 실패: ' + error.message);
            }
        }

        // 9. 삭제 함수
        async function deleteFile(id, filePath) {
            if (!confirm('정말 삭제하시겠습니까?')) return;

            try {
                // 스토리지 파일 삭제
                const { error: storageError } = await supabase.storage
                    .from(SUPABASE_BUCKET)
                    .remove([filePath]);
                
                if (storageError) console.warn('파일 삭제 경고:', storageError);

                // DB 데이터 삭제
                const { error: dbError } = await supabase
                    .from('files')
                    .delete()
                    .eq('id', id);

                if (dbError) throw dbError;

                alert('삭제되었습니다.');
                loadFiles();

            } catch (error) {
                alert('삭제 실패: ' + error.message);
            }
        }

        // 페이지 로딩 완료 시 실행
        window.addEventListener('load', loadFiles);
    </script>

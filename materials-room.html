<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자료방</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .back-button:hover {
            background: #764ba2;
        }

        .upload-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px dashed #667eea;
            transition: all 0.3s ease;
        }

        .upload-section.drag-over {
            background: #e3f2fd;
            border-color: #2196f3;
            transform: scale(1.02);
        }

        .upload-section h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .drop-area {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .drop-area:hover {
            background: #f0f0f0;
        }

        .drop-area p {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 10px;
        }

        .file-input {
            display: none;
        }

        .upload-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.3s ease;
        }

        .upload-button:hover {
            transform: translateY(-3px);
        }

        .progress-bar-container {
            display: none;
            margin-top: 15px;
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .file-list {
            margin-top: 30px;
        }

        .file-item {
            background: #f8f9fa;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .file-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .file-info {
            flex: 1;
        }

        .file-info h3 {
            color: #764ba2;
            margin-bottom: 5px;
            cursor: pointer;
            text-decoration: underline;
        }

        .file-info h3:hover {
            color: #667eea;
        }

        .file-info p {
            color: #666;
            font-size: 0.9em;
        }

        .file-meta {
            display: flex;
            gap: 15px;
            margin-top: 5px;
            font-size: 0.85em;
            color: #999;
        }

        .delete-button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            margin-left: 10px;
            transition: transform 0.3s ease;
        }

        .delete-button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← 돌아가기</a>
        
        <div class="header">
            <h1>📚 자료방</h1>
            <p>강사와 수강생이 자료를 공유하는 공간</p>
        </div>

        <!-- 파일 업로드 섹션 -->
        <div class="upload-section" id="uploadSection">
            <h2>📤 파일 업로드</h2>
            <div class="drop-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
                <p>파일을 드래그하여 여기에 놓으세요</p>
                <p style="font-size: 0.9em; color: #999;">또는 클릭하여 파일 선택 (최대 20MB)</p>
                <button class="upload-button">파일 선택</button>
            </div>
            <input type="file" id="fileInput" class="file-input" multiple onchange="handleFileSelect(event)">
            <div class="progress-bar-container" id="progressContainer">
                <div>업로드 중...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

        <div class="file-list" id="fileList">
            <!-- 파일 목록이 여기에 동적으로 추가됩니다 -->
        </div>
    </div>

    <script>
        const MAX_FILE_SIZE = 20 * 1024 * 1024; // 20MB 제한
        const SUPABASE_BUCKET = 'class-materials';

        // Supabase 클라이언트 가져오기
        const supabase = window.supabaseClient;

        // 세션 확인
        const session = JSON.parse(sessionStorage.getItem('userSession') || '{}');
        if (!session.type || (session.type !== 'teacher' && session.type !== 'student' && session.type !== 'admin')) {
            alert('로그인이 필요합니다.');
            window.location.href = 'login.html';
        }

        // 드래그 앤 드롭 이벤트
        const dropArea = document.getElementById('dropArea');
        const uploadSection = document.getElementById('uploadSection');

        dropArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadSection.classList.add('drag-over');
        });

        dropArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            uploadSection.classList.remove('drag-over');
        });

        dropArea.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadSection.classList.remove('drag-over');
            const files = Array.from(e.dataTransfer.files);
            handleFiles(files);
        });

        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            handleFiles(files);
        }

        async function handleFiles(files) {
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            progressContainer.style.display = 'block';

            let uploaded = 0;
            let failed = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                if (file.size > MAX_FILE_SIZE) {
                    alert(`파일 "${file.name}"의 용량이 20MB를 초과합니다.`);
                    failed++;
                    continue;
                }

                try {
                    const fileExt = file.name.split('.').pop();
                    const uploaderName = session.name || session.username || '익명';
                    const fileName = `materials/${Date.now()}_${uploaderName}_${Math.random().toString(36).substr(2, 9)}.${fileExt}`;

                    const { data: uploadData, error: uploadError } = await supabase.storage
                        .from(SUPABASE_BUCKET)
                        .upload(fileName, file, {
                            cacheControl: '3600',
                            upsert: false
                        });

                    if (uploadError) {
                        console.error('Storage 업로드 오류:', uploadError);
                        alert(`파일 "${file.name}" 업로드 실패: ${uploadError.message}`);
                        failed++;
                        continue;
                    }

                    // 업로더 정보 저장 (메타데이터에 저장)
                                       
                    const { data: dbData, error: dbError } = await supabase
                        .from('files')
                        .insert([
                            { 
                                file_name: file.name, 
                                file_url: fileName, 
                                file_size: file.size, 
                                uploader_id: null,
                                year: null
                            }
                        ])
                        .select()
                        .single();
                    
                    // 파일 메타데이터에 업로더 이름 저장 (별도 테이블 또는 파일명에 포함)
                    // 현재는 session.name을 사용하여 표시

                    if (dbError) {
                        console.error('DB 저장 오류:', dbError);
                        alert(`파일 "${file.name}" 정보 저장 실패: ${dbError.message}`);
                        await supabase.storage.from(SUPABASE_BUCKET).remove([fileName]);
                        failed++;
                        continue;
                    }

                    uploaded++;

                    const progress = ((i + 1) / files.length) * 100;
                    progressFill.style.width = progress + '%';
                } catch (error) {
                    console.error('파일 업로드 오류:', error);
                    alert(`파일 "${file.name}" 업로드 중 오류가 발생했습니다: ${error.message}`);
                    failed++;
                }
            }

            await loadFiles();

            progressContainer.style.display = 'none';
            progressFill.style.width = '0%';
            document.getElementById('fileInput').value = '';

            if (uploaded > 0) {
                alert(`${uploaded}개의 파일이 성공적으로 업로드되었습니다.`);
            }
            if (failed > 0) {
                alert(`${failed}개의 파일 업로드에 실패했습니다.`);
            }
        }

        async function loadFiles() {
            try {
                const { data, error } = await supabase
                    .from('files')
                    .select('*')
                    .is('year', null)
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('파일 목록 로드 오류:', error);
                    return;
                }

                const fileList = document.getElementById('fileList');
                
                if (!data || data.length === 0) {
                    fileList.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">업로드된 파일이 없습니다.</p>';
                    return;
                }
                
                const fileItems = await Promise.all(data.map(async (file) => {
                    const fileSize = formatFileSize(file.file_size);
                    const uploadDate = new Date(file.created_at).toLocaleString('ko-KR');
                    
                    const { data: urlData } = supabase.storage
                        .from(SUPABASE_BUCKET)
                        .getPublicUrl(file.file_url);
                    
                    const canDelete = (session.type === 'teacher' || session.type === 'admin');
                    
                    return `
                        <div class="file-item">
                            <div class="file-info">
                                <h3 onclick="downloadFile('${file.id}', '${file.file_url}', '${file.file_name}')">${file.file_name}</h3>
                                <div class="file-meta">
                                    <span>크기: ${fileSize}</span>
                                    <span>올린 사람: ${extractUploaderName(file.file_url)}</span>
                                    <span>올린 날짜: ${uploadDate}</span>
                                </div>
                            </div>
                            ${canDelete ? `<button class="delete-button" onclick="deleteFile('${file.id}', '${file.file_url}')">삭제</button>` : ''}
                        </div>
                    `;
                }));
                
                fileList.innerHTML = fileItems.join('');
            } catch (error) {
                console.error('파일 로드 오류:', error);
            }
        }

        async function downloadFile(fileId, filePath, fileName) {
            try {
                const { data, error } = await supabase.storage
                    .from(SUPABASE_BUCKET)
                    .download(filePath);

                if (error) {
                    console.error('파일 다운로드 오류:', error);
                    alert('파일 다운로드 실패: ' + error.message);
                    return;
                }

                const url = URL.createObjectURL(data);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error('파일 다운로드 오류:', error);
                alert('파일 다운로드 중 오류가 발생했습니다.');
            }
        }

        async function deleteFile(fileId, filePath) {
            if (!confirm('이 파일을 삭제하시겠습니까?')) return;

            try {
                const { error: storageError } = await supabase.storage
                    .from(SUPABASE_BUCKET)
                    .remove([filePath]);

                if (storageError) {
                    console.error('Storage 삭제 오류:', storageError);
                    alert('파일 삭제 실패 (Storage): ' + storageError.message);
                    return;
                }

                const { error: dbError } = await supabase
                    .from('files')
                    .delete()
                    .eq('id', fileId);

                if (dbError) {
                    console.error('DB 삭제 오류:', dbError);
                    alert('파일 삭제 실패 (DB): ' + dbError.message);
                    return;
                }

                alert('파일이 성공적으로 삭제되었습니다.');
                await loadFiles();
            } catch (error) {
                console.error('파일 삭제 오류:', error);
                alert('파일 삭제 중 오류가 발생했습니다: ' + error.message);
            }
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function extractUploaderName(filePath) {
            // 파일 경로에서 업로더 이름 추출: materials/타임스탬프_업로더이름_랜덤.확장자
            if (!filePath) return '익명';
            const parts = filePath.split('/');
            if (parts.length < 2) return '익명';
            const fileName = parts[1];
            const nameParts = fileName.split('_');
            if (nameParts.length >= 2) {
                return decodeURIComponent(nameParts[1]) || '익명';
            }
            return '익명';
        }

        // 초기화
        window.addEventListener('load', async function() {
            if (!supabase) {
                console.error('Supabase 클라이언트를 찾을 수 없습니다.');
                alert('Supabase 연결에 실패했습니다. 페이지를 새로고침해주세요.');
                return;
            }
            await loadFiles();
        });
    </script>
</body>
</html>

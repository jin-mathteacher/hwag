<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자료방 (통합 버전)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* 디자인 스타일 (기존과 동일) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 3px solid #667eea; padding-bottom: 20px; }
        .upload-section { background: #f8f9fa; padding: 30px; border-radius: 15px; border: 2px dashed #667eea; margin-bottom: 30px; text-align: center; transition: all 0.3s; }
        .upload-section.drag-over { background: #e3f2fd; border-color: #2196f3; transform: scale(1.02); }
        .file-item { background: #f1f3f5; padding: 15px; margin: 10px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        button { cursor: pointer; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; }
        .upload-btn { background: #667eea; color: white; }
        .delete-btn { background: #ff6b6b; color: white; margin-left: 10px; }
        h3 { cursor: pointer; color: #4c6ef5; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📚 자료방</h1>
            <p>파일을 드래그하거나 버튼을 눌러 업로드하세요</p>
        </div>

        <div class="upload-section" id="dropArea">
            <p style="font-size: 1.2rem; margin-bottom: 10px;">📂 여기에 파일을 놓으세요</p>
            <input type="file" id="fileInput" style="display: none;" multiple>
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">파일 선택하기</button>
            <div id="statusMsg" style="margin-top: 15px; color: #666;"></div>
        </div>

        <div id="fileList">
            <p>로딩 중...</p>
        </div>
    </div>

    <script>
        // ==========================================
        // [중요] 여기에 선생님의 키를 정확히 확인해주세요!
        // ==========================================
        const SUPABASE_URL = 'https://jxeyvvstwoktkoaltmie.supabase.co';
        
        // ★ 주의: 키가 'sb_publishable_...'로 시작하면 안 될 수도 있습니다.
        // 보통 'eyJ...'로 시작하는 긴 문자열입니다. (Project Settings -> API -> anon public key)
        // 만약 아래 키로 안 되면, 대시보드에서 'anon' 키를 다시 복사해서 넣어보세요.
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4ZXl2dnN0d29rdGtvYWx0bWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2MDQ5MTAsImV4cCI6MjA4MzE4MDkxMH0.iQOBtE9XH7EhZt2vC1wM_CrgD06oxCgHpus0LO8bc-I'; 

        // 1. Supabase 연결 시작
        let supabase;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            console.log("✅ Supabase 연결 성공");
        } catch (err) {
            console.error("Supabase 연결 실패:", err);
            alert("오류: Supabase 연결에 실패했습니다. 키를 확인해주세요.");
        }

        const BUCKET_NAME = 'class-materials';
        const TABLE_NAME = 'files';

        // 2. 드래그 앤 드롭 설정
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const statusMsg = document.getElementById('statusMsg');

        // 드래그 들어왔을 때
        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('drag-over');
        });

        // 드래그 나갔을 때
        dropArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropArea.classList.remove('drag-over');
        });

        // 파일을 놓았을 때
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            handleUpload(files);
        });

        // 파일 선택 버튼 눌렀을 때
        fileInput.addEventListener('change', (e) => {
            handleUpload(e.target.files);
        });

        // 3. 업로드 처리 함수
        async function handleUpload(files) {
            if (files.length === 0) return;
            statusMsg.innerText = "⏳ 업로드 중...";

            for (let file of files) {
                try {
                    // 한글 파일명 깨짐 방지: 시간_랜덤_파일명
                    const safeName = `${Date.now()}_${Math.random().toString(36).substring(2,7)}`;
                    const filePath = `uploads/${safeName}`; // 확장자는 생략하거나 원본 유지 가능

                    // A. 스토리지에 올리기
                    const { data: storageData, error: storageError } = await supabase.storage
                        .from(BUCKET_NAME)
                        .upload(filePath, file);

                    if (storageError) throw storageError;

                    // B. DB에 정보 적기
                    const { error: dbError } = await supabase
                        .from(TABLE_NAME)
                        .insert([{
                            file_name: file.name,
                            file_url: filePath,
                            file_size: file.size,
                            uploader_id: null // 익명 허용
                        }]);

                    if (dbError) throw dbError;

                } catch (error) {
                    console.error("업로드 실패:", error);
                    alert(`"${file.name}" 업로드 실패!\n원인: ${error.message}`);
                }
            }

            statusMsg.innerText = "✅ 업로드 완료!";
            fileInput.value = ""; // 입력창 초기화
            loadFiles(); // 목록 새로고침
        }

        // 4. 목록 불러오기 함수
        async function loadFiles() {
            const fileListDiv = document.getElementById('fileList');
            
            const { data, error } = await supabase
                .from(TABLE_NAME)
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                fileListDiv.innerHTML = "<p>목록을 불러오지 못했습니다.</p>";
                return;
            }

            if (data.length === 0) {
                fileListDiv.innerHTML = "<p>업로드된 파일이 없습니다.</p>";
                return;
            }

            fileListDiv.innerHTML = data.map(file => `
                <div class="file-item">
                    <div>
                        <h3 onclick="downloadFile('${file.file_url}', '${file.file_name}')">📄 ${file.file_name}</h3>
                        <small>${new Date(file.created_at).toLocaleString()} | ${(file.file_size/1024).toFixed(1)} KB</small>
                    </div>
                    <button class="delete-btn" onclick="deleteFile('${file.id}', '${file.file_url}')">삭제</button>
                </div>
            `).join('');
        }

        // 5. 다운로드 함수
        async function downloadFile(path, name) {
            const { data, error } = await supabase.storage.from(BUCKET_NAME).download(path);
            if (error) { alert("다운로드 실패"); return; }
            
            const url = URL.createObjectURL(data);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 6. 삭제 함수
        async function deleteFile(id, path) {
            if(!confirm("삭제하시겠습니까?")) return;
            
            await supabase.storage.from(BUCKET_NAME).remove([path]);
            await supabase.from(TABLE_NAME).delete().eq('id', id);
            
            alert("삭제되었습니다.");
            loadFiles();
        }

        // 시작 시 목록 로드
        loadFiles();
    </script>
</body>
</html>

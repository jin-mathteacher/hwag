<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강사 대시보드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .class-section {
            margin-top: 30px;
        }

        .class-section h2 {
            color: #764ba2;
            margin-bottom: 20px;
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .class-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .class-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .class-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .class-card p {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .class-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .class-stats span {
            color: #999;
        }

        .class-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-success {
            background: #43e97b;
            color: white;
        }

        .add-class-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .add-class-btn:hover {
            transform: translateY(-3px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
        }

        .modal-content h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>강사 대시보드</h1>
            <div>
                <span style="color: #666; margin-right: 15px;">안녕하세요, <strong id="teacherName"></strong>님</span>
                <a href="login.html" class="logout-btn" onclick="logout()">로그아웃</a>
            </div>
        </div>

        <div class="class-section">
            <h2>내 클래스 관리</h2>
            <button class="add-class-btn" onclick="showAddClassModal()">+ 새 클래스 생성</button>
            
            <div class="class-grid" id="classGrid">
                <p style="text-align: center; color: #999; padding: 20px; grid-column: 1 / -1;">클래스가 없습니다. 새 클래스를 생성해주세요.</p>
            </div>
        </div>
    </div>

    <!-- 클래스 추가 모달 -->
    <div id="addClassModal" class="modal">
        <div class="modal-content">
            <h2>새 클래스 생성</h2>
            <div class="form-group">
                <label>클래스 이름 *</label>
                <input type="text" id="newClassName" placeholder="예: 2026년 1기" required>
            </div>
            <div class="form-group">
                <label>설명 (선택)</label>
                <textarea id="newClassDescription" rows="3" placeholder="클래스에 대한 설명을 입력하세요"></textarea>
            </div>
            <div class="form-group">
                <label>수강생 등록 코드 (자동 생성)</label>
                <input type="text" id="classCode" readonly style="background: #f5f5f5;">
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="addNewClass()">생성</button>
                <button class="btn btn-danger" onclick="closeAddClassModal()">취소</button>
            </div>
        </div>
    </div>

    <!-- Supabase 스크립트 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <script>
        // 전역 변수
        let username = null;
        let session = null;

        // Supabase 클라이언트 가져오기 (초기화 대기)
        function getSupabaseClient() {
            if (window.supabaseClient) {
                return window.supabaseClient;
            }
            // Supabase가 아직 로드되지 않았으면 직접 생성
            if (typeof supabase !== 'undefined') {
                const SUPABASE_URL = 'https://jxeyvvstwoktkoaltmie.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4ZXl2dnN0d29rdGtvYWx0bWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2MDQ5MTAsImV4cCI6MjA4MzE4MDkxMH0.iQOBtE9XH7EhZt2vC1wM_CrgD06oxCgHpus0LO8bc-I';
                window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('✅ Supabase 클라이언트 생성 완료');
                return window.supabaseClient;
            }
            console.warn('⚠️ Supabase 클라이언트를 사용할 수 없습니다.');
            return null;
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📋 강사 대시보드 초기화 시작...');
            console.log('📋 sessionStorage 내용:', sessionStorage.getItem('userSession'));
            
            // 세션 확인
            try {
                const sessionStr = sessionStorage.getItem('userSession');
                console.log('📋 세션 문자열:', sessionStr);
                
                if (!sessionStr) {
                    console.error('❌ 세션이 없습니다!');
                    alert('로그인 세션이 없습니다. 다시 로그인해주세요.');
                    window.location.href = 'login.html';
                    return;
                }
                
                session = JSON.parse(sessionStr);
                console.log('📋 파싱된 세션 정보:', session);
                console.log('📋 세션 타입:', session.type);
                console.log('📋 세션 사용자명:', session.username);
                
                if (!session.type || session.type !== 'teacher') {
                    console.error('❌ 강사 권한이 없습니다. 세션 타입:', session.type);
                    alert('강사 권한이 필요합니다.');
                    window.location.href = 'login.html';
                    return;
                }

                username = session.username;
                console.log('👤 강사 이름 변수 설정:', username);
                
                if (!username || username === 'undefined' || username === 'null') {
                    console.error('❌ 사용자명이 없거나 잘못되었습니다!', username);
                    alert('사용자명을 찾을 수 없습니다. 다시 로그인해주세요.');
                    window.location.href = 'login.html';
                    return;
                }

                // 강사 이름 표시
                const teacherNameElement = document.getElementById('teacherName');
                if (teacherNameElement) {
                    teacherNameElement.textContent = username;
                    console.log('✅ 강사 이름 표시 완료:', username);
                } else {
                    console.error('❌ teacherName 요소를 찾을 수 없습니다!');
                    // 1초 후 다시 시도
                    setTimeout(() => {
                        const retryElement = document.getElementById('teacherName');
                        if (retryElement) {
                            retryElement.textContent = username;
                            console.log('✅ 강사 이름 표시 완료 (재시도):', username);
                        }
                    }, 100);
                }

                // 클래스 목록 로드
                console.log('📋 클래스 목록 로드 시작...');
                loadClasses().then(() => {
                    console.log('✅ 클래스 목록 로드 완료');
                }).catch(err => {
                    console.error('❌ 클래스 목록 로드 실패:', err);
                });
            } catch (error) {
                console.error('❌ 초기화 오류:', error);
                console.error('❌ 오류 스택:', error.stack);
                alert('페이지 로드 중 오류가 발생했습니다: ' + error.message);
            }
        });

        // Supabase에서 클래스 목록 가져오기
        async function getTeacherClasses() {
            if (!username) {
                console.error('❌ 사용자명이 없습니다!');
                return [];
            }
            
            const supabaseClient = getSupabaseClient();
            
            if (supabaseClient) {
                try {
                    console.log('📡 Supabase에서 클래스 목록 조회 중...', username);
                    const { data, error } = await supabaseClient
                        .from('classes')
                        .select('*')
                        .eq('teacher_username', username)
                        .order('created_at', { ascending: false });
                    
                    console.log('Supabase 클래스 목록 조회 결과:', { data, error });
                
                    if (error) {
                        console.error('Supabase 클래스 목록 조회 오류:', error);
                        // 테이블이 없거나 에러가 발생한 경우 localStorage에서 가져오기
                        if (error.code === 'PGRST116' || error.message?.includes('relation') || error.message?.includes('does not exist')) {
                            console.warn('Supabase 테이블이 없습니다. localStorage에서 가져옵니다.');
                        }
                    } else if (data) {
                        // Supabase 데이터를 기존 형식으로 변환
                        console.log('Supabase에서 클래스 목록 가져오기 성공:', data.length, '개');
                        return (data || []).map(cls => ({
                            id: cls.id,
                            name: cls.name,
                            description: cls.description || '',
                            code: cls.code,
                            createdAt: new Date(cls.created_at).getTime(),
                            students: [] // students는 별도로 조회
                        }));
                    }
                } catch (error) {
                    console.error('클래스 목록 조회 예외:', error);
                }
            }
            
            // Supabase를 사용할 수 없거나 오류 발생 시 localStorage에서 가져오기
            console.log('localStorage에서 클래스 목록 가져오기...');
            const key = `teacher_classes_${username}`;
            const saved = localStorage.getItem(key);
            const classes = saved ? JSON.parse(saved) : [];
            console.log('localStorage에서 클래스 목록 가져오기 성공:', classes.length, '개');
            return classes;
        }

        // Supabase에 클래스 저장
        async function saveTeacherClasses(classes) {
            // 이 함수는 더 이상 사용하지 않지만 하위 호환성을 위해 유지
            // 실제 저장은 addNewClass에서 직접 수행
        }

        function generateClassCode() {
            return 'CLASS_' + Date.now().toString(36).toUpperCase() + '_' + Math.random().toString(36).substr(2, 5).toUpperCase();
        }

        function showAddClassModal() {
            console.log('📝 클래스 생성 모달 열기');
            const modal = document.getElementById('addClassModal');
            const codeInput = document.getElementById('classCode');
            
            if (!modal) {
                console.error('❌ 모달을 찾을 수 없습니다!');
                alert('모달을 찾을 수 없습니다. 페이지를 새로고침해주세요.');
                return;
            }
            
            if (!codeInput) {
                console.error('❌ 등록 코드 입력 필드를 찾을 수 없습니다!');
                alert('등록 코드 입력 필드를 찾을 수 없습니다. 페이지를 새로고침해주세요.');
                return;
            }
            
            modal.style.display = 'flex';
            const newCode = generateClassCode();
            codeInput.value = newCode;
            console.log('✅ 등록 코드 생성:', newCode);
        }

        function closeAddClassModal() {
            document.getElementById('addClassModal').style.display = 'none';
            document.getElementById('newClassName').value = '';
            document.getElementById('newClassDescription').value = '';
        }

        async function addNewClass() {
            console.log('📝 클래스 생성 함수 호출됨');
            
            if (!username) {
                console.error('❌ 사용자명이 없습니다!');
                alert('사용자명을 찾을 수 없습니다. 페이지를 새로고침해주세요.');
                return;
            }
            
            const nameInput = document.getElementById('newClassName');
            const classCodeInput = document.getElementById('classCode');
            const descriptionInput = document.getElementById('newClassDescription');
            
            if (!nameInput || !classCodeInput) {
                console.error('❌ 입력 필드를 찾을 수 없습니다!');
                alert('입력 필드를 찾을 수 없습니다. 페이지를 새로고침해주세요.');
                return;
            }
            
            const name = nameInput.value.trim();
            if (!name) {
                alert('클래스 이름을 입력해주세요.');
                return;
            }
            
            const classCode = classCodeInput.value.trim();
            if (!classCode) {
                alert('등록 코드가 생성되지 않았습니다. 페이지를 새로고침해주세요.');
                return;
            }
            
            const classId = 'class_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const description = descriptionInput ? descriptionInput.value.trim() : '';
            
            console.log('📝 클래스 생성 시작:', { name, classCode, classId, username, description });
            
            const supabaseClient = getSupabaseClient();
            
            // Supabase에 저장 시도
            if (supabaseClient) {
                try {
                    console.log('Supabase에 클래스 저장 시도 중...');
                    const { data, error } = await supabaseClient
                        .from('classes')
                        .insert([
                            {
                                id: classId,
                                name: name,
                                description: description,
                                code: classCode.toUpperCase(),
                                teacher_username: username
                            }
                        ])
                        .select();
                    
                    console.log('Supabase 저장 결과:', { data, error });
                    
                    if (error) {
                        console.error('Supabase 클래스 생성 오류:', error);
                        // 테이블이 없거나 에러가 발생한 경우 localStorage에만 저장
                        if (error.code === 'PGRST116' || error.message?.includes('relation') || error.message?.includes('does not exist')) {
                            console.warn('Supabase 테이블이 없습니다. localStorage에만 저장합니다.');
                            alert('⚠️ Supabase 테이블이 설정되지 않았습니다. localStorage에만 저장됩니다.\n\nSupabase 대시보드에서 supabase-classes-setup.sql을 실행해주세요.');
                        } else {
                            alert('⚠️ Supabase 저장 실패: ' + error.message + '\n\nlocalStorage에만 저장됩니다.');
                        }
                    } else if (data && data.length > 0) {
                        console.log('✅ Supabase에 클래스 저장 성공:', data);
                    }
                } catch (error) {
                    console.error('클래스 생성 예외:', error);
                    alert('⚠️ 클래스 생성 중 오류가 발생했습니다: ' + error.message);
                }
            } else {
                console.warn('Supabase 클라이언트를 사용할 수 없습니다. localStorage에만 저장합니다.');
            }
                
            // localStorage에 저장 (항상 저장 - 하위 호환성)
            console.log('localStorage에 클래스 저장 중...');
            const key = `teacher_classes_${username}`;
            const existingClasses = JSON.parse(localStorage.getItem(key) || '[]');
            
            // 중복 확인
            if (existingClasses.some(c => c.code === classCode.toUpperCase())) {
                alert('이미 같은 등록 코드를 가진 클래스가 있습니다.');
                return;
            }
            
            existingClasses.push({
                id: classId,
                name: name,
                description: description,
                code: classCode.toUpperCase(),
                createdAt: Date.now(),
                students: []
            });
            localStorage.setItem(key, JSON.stringify(existingClasses));
            console.log('✅ localStorage에 클래스 저장 완료');
            
            // 클래스 데이터 초기화
            const classData = {
                practice1: {
                    words: {},
                    participants: [],
                    lastUpdate: Date.now()
                },
                practice2: {
                    notes: [],
                    participants: [],
                    lastUpdate: Date.now()
                }
            };
            localStorage.setItem(`class_data_${classId}`, JSON.stringify(classData));
            
            closeAddClassModal();
            await loadClasses();
            
            alert(`✅ 클래스가 생성되었습니다!\n\n수강생 등록 코드: ${classCode.toUpperCase()}\n\n다른 컴퓨터에서도 이 코드로 접속할 수 있습니다.`);
        }

        async function deleteClass(classId) {
            if (!confirm('이 클래스를 삭제하시겠습니까? 클래스의 모든 데이터도 함께 삭제됩니다.')) return;
            
            const supabaseClient = getSupabaseClient();
            
            if (supabaseClient) {
                try {
                    // Supabase에서 클래스 삭제 (CASCADE로 students도 자동 삭제됨)
                    const { error } = await supabaseClient
                        .from('classes')
                        .delete()
                        .eq('id', classId)
                        .eq('teacher_username', username);
                    
                    if (error) {
                        console.error('클래스 삭제 오류:', error);
                        alert('클래스 삭제 중 오류가 발생했습니다: ' + error.message);
                        return;
                    }
                } catch (error) {
                    console.error('클래스 삭제 오류:', error);
                    alert('클래스 삭제 중 오류가 발생했습니다.');
                }
            }
            
            // localStorage에서도 삭제 (항상 실행 - 하위 호환성)
            const key = `teacher_classes_${username}`;
            const existingClasses = JSON.parse(localStorage.getItem(key) || '[]');
            const filtered = existingClasses.filter(c => c.id !== classId);
            localStorage.setItem(key, JSON.stringify(filtered));
            
            // 클래스 데이터도 삭제
            localStorage.removeItem(`class_data_${classId}`);
            localStorage.removeItem(`wallboard_practice4_${classId}`);
            localStorage.removeItem(`reflection_practice5_${classId}`);
            
            await loadClasses();
        }

        function enterClass(classId) {
            const session = JSON.parse(sessionStorage.getItem('userSession') || '{}');
            session.classId = classId;
            sessionStorage.setItem('userSession', JSON.stringify(session));
            window.location.href = 'index.html';
        }

        async function loadClasses() {
            console.log('📋 loadClasses() 함수 호출됨');
            
            if (!username) {
                console.error('❌ loadClasses: 사용자명이 없습니다!');
                return;
            }
            
            const classes = await getTeacherClasses();
            console.log('📋 가져온 클래스 목록:', classes);
            
            const grid = document.getElementById('classGrid');
            if (!grid) {
                console.error('❌ classGrid 요소를 찾을 수 없습니다!');
                return;
            }
            
            if (classes.length === 0) {
                console.log('📋 클래스가 없습니다. 빈 메시지 표시');
                grid.innerHTML = '<p style="text-align: center; color: #999; padding: 20px; grid-column: 1 / -1;">클래스가 없습니다. 새 클래스를 생성해주세요.</p>';
                return;
            }
            
            console.log('📋 클래스 목록 렌더링 시작:', classes.length, '개');
            
            // 각 클래스의 수강생 목록을 Supabase에서 가져오기
            const supabaseClient = getSupabaseClient();
            for (let cls of classes) {
                if (supabaseClient) {
                    try {
                        const { data: students, error } = await supabaseClient
                            .from('students')
                            .select('*')
                            .eq('class_id', cls.id)
                            .order('registered_at', { ascending: false });
                        
                        if (!error && students) {
                            cls.students = students.map(s => ({
                                id: s.id,
                                name: s.name,
                                registeredAt: new Date(s.registered_at).getTime()
                            }));
                        } else {
                            cls.students = cls.students || [];
                        }
                    } catch (error) {
                        console.error('수강생 목록 조회 오류:', error);
                        cls.students = cls.students || [];
                    }
                } else {
                    // localStorage에서 수강생 정보 가져오기 (하위 호환성)
                    cls.students = cls.students || [];
                }
            }
            
            grid.innerHTML = classes.map(cls => {
                const classData = JSON.parse(localStorage.getItem(`class_data_${cls.id}`) || '{}');
                const practice1Count = classData.practice1 ? Object.keys(classData.practice1.words || {}).length : 0;
                const practice2Count = classData.practice2 ? (classData.practice2.notes?.length || 0) : 0;
                const studentCount = cls.students ? cls.students.length : 0;
                
                return `
                    <div class="class-card">
                        <h3>${cls.name}</h3>
                        ${cls.description ? `<p>${cls.description}</p>` : ''}
                        <div class="class-stats">
                            <span>수강생: ${studentCount}명</span>
                            <span>실습1: ${practice1Count}개</span>
                            <span>실습2: ${practice2Count}개</span>
                        </div>
                        <div style="margin-bottom: 10px;">
                            <small style="color: #999;">등록 코드: <strong>${cls.code}</strong></small>
                        </div>
                        <div class="class-actions">
                            <button class="btn btn-primary" onclick="enterClass('${cls.id}')">입장</button>
                            <button class="btn btn-danger" onclick="deleteClass('${cls.id}')">클래스 삭제</button>
                        </div>
                        ${studentCount > 0 ? `
                            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;">
                                <h4 style="color: #667eea; margin-bottom: 10px;">수강생 목록</h4>
                                <div style="max-height: 200px; overflow-y: auto;">
                                    ${cls.students.map((student, idx) => `
                                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; background: #f8f9fa; border-radius: 5px; margin-bottom: 5px;">
                                            <span>${student.name || '익명'} (${student.id || 'N/A'})</span>
                                            <button class="btn btn-danger" style="padding: 4px 10px; font-size: 0.85em;" onclick="deleteStudent('${cls.id}', '${student.id}')">삭제</button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
            
            console.log('✅ 클래스 목록 렌더링 완료');
        }

        async function deleteStudent(classId, studentId) {
            if (!confirm('이 수강생을 삭제하시겠습니까?')) return;
            
            const supabaseClient = getSupabaseClient();
            
            if (supabaseClient) {
                try {
                    // Supabase에서 수강생 삭제
                    const { error } = await supabaseClient
                        .from('students')
                        .delete()
                        .eq('id', studentId)
                        .eq('class_id', classId);
                    
                    if (error) {
                        console.error('수강생 삭제 오류:', error);
                        alert('수강생 삭제 중 오류가 발생했습니다: ' + error.message);
                        return;
                    }
                    
                    await loadClasses();
                    alert('수강생이 삭제되었습니다.');
                } catch (error) {
                    console.error('수강생 삭제 오류:', error);
                    alert('수강생 삭제 중 오류가 발생했습니다.');
                }
            } else {
                // localStorage에서 삭제 (하위 호환성)
                const key = `teacher_classes_${username}`;
                const classes = JSON.parse(localStorage.getItem(key) || '[]');
                for (let cls of classes) {
                    if (cls.id === classId && cls.students) {
                        cls.students = cls.students.filter(s => s.id !== studentId);
                        localStorage.setItem(key, JSON.stringify(classes));
                        await loadClasses();
                        alert('수강생이 삭제되었습니다.');
                        return;
                    }
                }
            }
        }

        function logout() {
            sessionStorage.removeItem('userSession');
        }

        // 페이지 로드 완료 후 추가 확인 (이미 DOMContentLoaded에서 처리됨)
        window.addEventListener('load', function() {
            console.log('📋 페이지 로드 완료');
            // 이미 DOMContentLoaded에서 loadClasses()가 호출됨
            // username이 제대로 설정되었는지 확인
            if (!username) {
                console.warn('⚠️ 페이지 로드 완료 후에도 사용자명이 없습니다.');
            }
        });
    </script>
</body>

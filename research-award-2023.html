<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2023년 연구대회 수상작 - 파일 다운로드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.2em;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .back-button:hover {
            background: #764ba2;
        }

        .file-list {
            margin-top: 30px;
        }

        .file-item {
            background: #f8f9fa;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .file-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .file-info {
            flex: 1;
        }

        .file-info h3 {
            color: #764ba2;
            margin-bottom: 5px;
        }

        .file-info p {
            color: #666;
            font-size: 0.9em;
        }

        .download-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .download-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #333;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-left: 10px;
        }

        .upload-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px dashed #667eea;
            transition: all 0.3s ease;
        }

        .upload-section.drag-over {
            background: #e3f2fd;
            border-color: #2196f3;
            transform: scale(1.02);
        }

        .upload-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-area {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            background: #f0f0f0;
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 0.9em;
            color: #999;
        }

        .file-input {
            display: none;
        }

        .upload-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.3s ease;
        }

        .upload-button:hover {
            transform: translateY(-3px);
        }

        .file-item {
            position: relative;
        }

        .delete-button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            margin-left: 10px;
            transition: transform 0.3s ease;
        }

        .delete-button:hover {
            transform: scale(1.1);
        }

        .file-size {
            color: #999;
            font-size: 0.85em;
            margin-left: 10px;
        }

        .upload-progress {
            display: none;
            margin-top: 15px;
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
    <!-- Supabase 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase 설정 -->
    <script src="js/supabase-config.js"></script>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← 돌아가기</a>
        
        <div class="header">
            <h1>2023년 연구대회 수상작</h1>
            <p>연구대회 수상작 자료 다운로드 <span class="badge">수상작</span></p>
        </div>

        <!-- 파일 업로드 섹션 (강사/관리자만 표시) -->
        <div id="uploadSection" class="upload-section" style="display: none;">
            <h2>📤 파일 업로드</h2>
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📁</div>
                <div class="upload-text">파일을 드래그하여 여기에 놓으세요</div>
                <div class="upload-hint">또는 클릭하여 파일 선택</div>
                <button class="upload-button">파일 선택</button>
            </div>
            <input type="file" id="fileInput" class="file-input" multiple onchange="handleFileSelect(event)">
            <div class="upload-progress" id="uploadProgress">
                <div>업로드 중...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

        <div class="file-list" id="fileList">
            <!-- 파일 목록이 여기에 동적으로 추가됩니다 -->
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'research_award_2023_files';
        const MAX_FILE_SIZE = 20 * 1024 * 1024; // 20MB 제한

        // 권한 확인
        const session = JSON.parse(sessionStorage.getItem('userSession') || '{}');
        const isTeacherOrAdmin = session.type === 'teacher' || session.type === 'admin';
        
        if (isTeacherOrAdmin) {
            document.getElementById('uploadSection').style.display = 'block';
        }

        // 파일 목록 로드
        function loadFiles() {
            const files = getFiles();
            const fileList = document.getElementById('fileList');
            
            if (files.length === 0) {
                fileList.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">업로드된 파일이 없습니다.</p>';
                return;
            }
            
            fileList.innerHTML = files.map((file, index) => {
                const fileSize = formatFileSize(file.size);
                const uploadDate = new Date(file.uploadDate).toLocaleString('ko-KR');
                
                return `
                    <div class="file-item">
                        <div class="file-info">
                            <h3>${getFileIcon(file.type)} ${file.name}</h3>
                            <p>${file.description || '파일 설명 없음'} <span class="file-size">(${fileSize})</span></p>
                            <small style="color: #999;">업로드일: ${uploadDate}</small>
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <a href="#" class="download-button" onclick="downloadFile('${file.id}', event)">다운로드</a>
                            ${isTeacherOrAdmin ? `<button class="delete-button" onclick="deleteFile('${file.id}')">삭제</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getFiles() {
            const saved = localStorage.getItem(STORAGE_KEY);
            return saved ? JSON.parse(saved) : [];
        }

        function saveFiles(files) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function getFileIcon(mimeType) {
            if (mimeType.includes('pdf')) return '📄';
            if (mimeType.includes('word') || mimeType.includes('document')) return '📝';
            if (mimeType.includes('excel') || mimeType.includes('spreadsheet')) return '📊';
            if (mimeType.includes('powerpoint') || mimeType.includes('presentation')) return '📽️';
            if (mimeType.includes('image')) return '🖼️';
            if (mimeType.includes('video')) return '🎥';
            if (mimeType.includes('zip') || mimeType.includes('rar')) return '📦';
            return '📎';
        }

        // 드래그 앤 드롭 이벤트
        const uploadArea = document.getElementById('uploadArea');
        const uploadSection = document.getElementById('uploadSection');

        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadSection.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            uploadSection.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadSection.classList.remove('drag-over');
            const files = Array.from(e.dataTransfer.files);
            handleFiles(files);
        });

        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            handleFiles(files);
        }

        async function handleFiles(files) {
            if (!isTeacherOrAdmin) {
                alert('파일 업로드는 강사 또는 관리자만 가능합니다.');
                return;
            }

            const progressDiv = document.getElementById('uploadProgress');
            const progressFill = document.getElementById('progressFill');
            progressDiv.style.display = 'block';

            const existingFiles = getFiles();
            let uploaded = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                if (file.size > MAX_FILE_SIZE) {
                    alert('파일 용량은 20MB까지만 가능합니다.');
                    continue;
                }

                try {
                    const fileData = await readFileAsBase64(file);
                    const newFile = {
                        id: 'file_' + Date.now() + '_' + i + '_' + Math.random().toString(36).substr(2, 9),
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        data: fileData,
                        uploadDate: Date.now(),
                        uploadedBy: session.username || session.name || 'unknown'
                    };

                    existingFiles.push(newFile);
                    uploaded++;

                    // 진행률 업데이트
                    const progress = ((i + 1) / files.length) * 100;
                    progressFill.style.width = progress + '%';
                } catch (error) {
                    console.error('파일 읽기 오류:', error);
                    alert(`파일 "${file.name}" 업로드 중 오류가 발생했습니다.`);
                }
            }

            saveFiles(existingFiles);
            loadFiles();

            progressDiv.style.display = 'none';
            progressFill.style.width = '0%';
            document.getElementById('fileInput').value = '';

            if (uploaded > 0) {
                alert(`${uploaded}개의 파일이 업로드되었습니다.`);
            }
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    resolve(e.target.result);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function downloadFile(fileId, event) {
            event.preventDefault();
            const files = getFiles();
            const file = files.find(f => f.id === fileId);
            
            if (!file) {
                alert('파일을 찾을 수 없습니다.');
                return;
            }

            // base64 데이터를 Blob으로 변환
            const byteCharacters = atob(file.data.split(',')[1]);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: file.type });

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function deleteFile(fileId) {
            if (!isTeacherOrAdmin) {
                alert('파일 삭제는 강사 또는 관리자만 가능합니다.');
                return;
            }

            if (!confirm('이 파일을 삭제하시겠습니까?')) return;

            const files = getFiles();
            const filtered = files.filter(f => f.id !== fileId);
            saveFiles(filtered);
            loadFiles();
        }

        // 초기화
        window.addEventListener('load', function() {
            loadFiles();
        });
    </script>
</body>
</html>
